# Cloudflare Tunnel → nginx → strix-agent-service
# 對應 argus 的 server block；strix 服務由 docker-compose.strix.yml 以
# 127.0.0.1:8099 發佈（只綁 loopback，不直接對外）。
server {
    listen 80;
    listen 443;
    server_name strix.clouda.dpdns.org;
    access_log /var/log/nginx/clouda.dpdns.org/strix/access.log main;

    location / {
        proxy_pass http://127.0.0.1:8099;   # docker-compose.strix.yml 發佈的 loopback 埠
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 非同步協定：start/trace/result 都是短請求，預設逾時就夠。
        # 若仍用「同步」協定（POST /scan 會阻塞整場掃描），才需要調大這兩個值；
        # 但公開走同步並不建議（長連線 + Cloudflare 逾時），公開請用 async。
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # 服務只用 GET / POST（async 與 sync 皆然）；沿用 argus 的方法白名單。
    include /etc/nginx/method/only-get-post-options-patch-delete.conf;
    include /etc/nginx/errorPage.conf;
}
